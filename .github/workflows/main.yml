name: NiDG.SKU - Vérification & Auto-Fix

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  ni-dg-sku-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "Pas de requirements.txt"
          cargo install --locked || true

      - name: NiDG.SKU - Validation Node_Froid (axiomes & syntaxe)
        run: |
          python -m pyright . || true
          python polyglotte.py --validate || true
          python repertoire_ia_junior.py --check || true

      - name: NiDG.SKU - Auto-Fix (Node_Chaud - Intention active)
        run: |
          black . --line-length 120 || true
          isort . || true
          cargo fmt || true
          python generer_piliers_sku.py --fix || true

      - name: Lint & Sécurité
        run: |
          pylint **/*.py || true
          cargo clippy --all-targets -- -D warnings || true
          bandit -r . || true

      - name: Tests NiDG.SKU
        run: |
          python -m pytest tests/ --ni-dg-sku || echo "Pas de tests folder"

      - name: Rapport final LOCKÉ EN TABARNAK
        run: |
          echo "=== NiDG.SKU CI TERMINÉ ==="
          echo "Node_Froid vérifié | Node_Chaud corrigé"
          echo "LOCKÉ EN TABARNAK"
